<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Post Reviewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0a66c2;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0a66c2;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .card-header-text h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .card-header-text .email {
      font-size: 0.82rem;
      color: #777;
      margin-top: 2px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      line-height: 1.55;
      resize: vertical;
      color: #1a1a1a;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #0a66c2;
      box-shadow: 0 0 0 3px rgba(10,102,194,0.12);
    }

    .approve-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      color: #333;
      cursor: pointer;
      user-select: none;
    }

    .approve-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #0a66c2;
    }

    .send-btn {
      padding: 11px 20px;
      background: #0a66c2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .send-btn:disabled {
      background: #b0c4de;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .send-btn:not(:disabled):hover {
      background: #004182;
    }

    .send-btn.sending {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .confirmation {
      display: none;
      background: #e6f4ea;
      color: #1e7e34;
      border: 1px solid #a8d5b0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .confirmation.show {
      display: block;
    }

    .error-msg {
      display: none;
      background: #fdecea;
      color: #c0392b;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
    }

    .error-msg.show {
      display: block;
    }

    #load-error {
      text-align: center;
      color: #c0392b;
      background: #fdecea;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 16px 20px;
      max-width: 500px;
      margin: 0 auto;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>LinkedIn Post Reviewer</h1>
  <p class="subtitle">Review and approve posts before sending to each executive.</p>
  <div id="cards"></div>

  <script>
    async function loadPosts() {
      const container = document.getElementById("cards");
      let posts;
      try {
        const res = await fetch("/api/posts");
        const data = await res.json();
        if (!res.ok) {
          container.innerHTML = `<div id="load-error">Could not load posts: ${data.error}</div>`;
          return;
        }
        posts = data;
      } catch (e) {
        container.innerHTML = `<div id="load-error">Could not reach the server. Make sure app.py is running.</div>`;
        return;
      }

      if (!posts.length) {
        container.innerHTML = `<div id="load-error">No posts found in posts.json.</div>`;
        return;
      }

      posts.forEach((person, i) => {
        const initials = person.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">${initials}</div>
            <div class="card-header-text">
              <h2>${escapeHtml(person.name)}</h2>
              <div class="email">${escapeHtml(person.email)}</div>
            </div>
          </div>
          <textarea id="post-${i}">${escapeHtml(person.post)}</textarea>
          <label class="approve-row">
            <input type="checkbox" id="approve-${i}" />
            I approve this post
          </label>
          <button class="send-btn" id="send-${i}" disabled>Send Email</button>
          <div class="confirmation" id="confirm-${i}">
            Email sent successfully to ${escapeHtml(person.email)}!
          </div>
          <div class="error-msg" id="error-${i}"></div>
        `;
        container.appendChild(card);

        const checkbox = document.getElementById(`approve-${i}`);
        const btn = document.getElementById(`send-${i}`);

        checkbox.addEventListener("change", () => {
          btn.disabled = !checkbox.checked;
        });

        btn.addEventListener("click", () => sendEmail(i, person.name, person.email));
      });
    }

    async function sendEmail(i, name, email) {
      const post = document.getElementById(`post-${i}`).value.trim();
      const btn = document.getElementById(`send-${i}`);
      const confirm = document.getElementById(`confirm-${i}`);
      const errorDiv = document.getElementById(`error-${i}`);

      confirm.classList.remove("show");
      errorDiv.classList.remove("show");

      btn.disabled = true;
      btn.classList.add("sending");
      btn.textContent = "Sending...";

      try {
        const res = await fetch("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, post })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          confirm.classList.add("show");
          btn.textContent = "Sent";
          document.getElementById(`approve-${i}`).disabled = true;
        } else {
          errorDiv.textContent = data.error || "Something went wrong. Please try again.";
          errorDiv.classList.add("show");
          btn.textContent = "Send Email";
          btn.disabled = false;
          btn.classList.remove("sending");
        }
      } catch (e) {
        errorDiv.textContent = "Network error. Is the server running?";
        errorDiv.classList.add("show");
        btn.textContent = "Send Email";
        btn.disabled = false;
        btn.classList.remove("sending");
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadPosts();
  </script>
</body>
</html>
